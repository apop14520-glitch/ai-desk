[project]
name = "ai-desk"
version = "0.1.0"
description = "Personal AI Council - three heads, one question"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "anthropic>=1.0",
    "google-genai>=1.0",
    "claude-agent-sdk>=0.1",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The package directory doesn't match the project name, so hatchling can't
# guess what to ship.
[tool.hatch.build.targets.wheel]
packages = ["council"]
